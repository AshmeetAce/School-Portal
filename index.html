<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>School Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
      
    /* LOGIN */
    #loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#1e1e2e; }
    .login-box { background:#fff; border-radius:12px; padding:40px; width:100%; max-width:380px; box-shadow:0 4px 24px rgba(0,0,0,0.2); text-align:center; }
    .login-box h1 { font-size:22px; margin-bottom:4px; }
    .login-box p  { font-size:13px; color:#888; margin-bottom:24px; }
    .tab-row { display:flex; gap:8px; margin-bottom:20px; }
    .tab { flex:1; padding:10px; border:2px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; font-size:14px; font-weight:bold; }
    .tab.active { border-color:#4f46e5; background:#eef2ff; color:#4f46e5; }
    .login-box input { width:100%; padding:11px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:14px; outline:none; }
    .login-box input:focus { border-color:#4f46e5; }
    .btn-login { width:100%; padding:12px; background:#4f46e5; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; }
    .btn-login:hover { background:#4338ca; }
    .login-err { color:red; font-size:13px; margin-bottom:10px; }

    /* APP */
    #appScreen { display:none; min-height:100vh; }
    .topbar { background:#1e1e2e; color:#fff; padding:0 20px; height:56px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
    .topbar-left { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:bold; }
    .role-tag { font-size:10px; background:#4f46e5; padding:3px 8px; border-radius:20px; font-weight:normal; }
    .btn-home { padding:7px 14px; background:#ef4444; color:#fff; border:none; border-radius:7px; cursor:pointer; font-size:13px; font-weight:bold; }
    .btn-home:hover { background:#dc2626; }
    .nav-tabs { background:#fff; border-bottom:2px solid #e5e7eb; display:flex; overflow-x:auto; padding:0 16px; }
    .nav-tab { padding:14px 18px; cursor:pointer; font-size:13px; font-weight:bold; color:#6b7280; border-bottom:3px solid transparent; white-space:nowrap; transition:all 0.15s; }
    .nav-tab:hover { color:#4f46e5; }
    .nav-tab.active { color:#4f46e5; border-bottom-color:#4f46e5; }
    .content { padding:24px; max-width:1100px; margin:0 auto; }

    /* CARDS & STATS */
    .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; margin-bottom:24px; }
    .stat-card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,0.08); text-align:center; }
    .stat-card .num { font-size:32px; font-weight:bold; color:#4f46e5; }
    .stat-card .lbl { font-size:13px; color:#6b7280; margin-top:4px; }
    .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:20px; }
    .card h2 { font-size:16px; margin-bottom:16px; color:#111; }

    /* TABLE */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:#f9fafb; padding:10px 14px; text-align:left; font-size:11px; color:#6b7280; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid #e5e7eb; }
    td { padding:12px 14px; border-bottom:1px solid #f3f4f6; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafafa; }

    /* BADGES */
    .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:bold; text-transform:uppercase; }
    .b-science  { background:#eef2ff; color:#4f46e5; }
    .b-commerce { background:#ecfdf5; color:#059669; }
    .b-arts     { background:#fffbeb; color:#d97706; }
    .b-male     { background:#eff6ff; color:#2563eb; }
    .b-female   { background:#fdf2f8; color:#db2777; }
    .b-grade    { background:#ecfdf5; color:#059669; }

    /* BUTTONS */
    .btn-add    { padding:9px 18px; background:#4f46e5; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:bold; }
    .btn-add:hover { background:#4338ca; }
    .btn-edit   { padding:5px 12px; background:#eef2ff; color:#4f46e5; border:1px solid #c7d2fe; border-radius:6px; cursor:pointer; font-size:12px; }
    .btn-del    { padding:5px 12px; background:#fef2f2; color:#ef4444; border:1px solid #fecaca; border-radius:6px; cursor:pointer; font-size:12px; }
    .btn-cancel { padding:9px 18px; background:#f3f4f6; color:#6b7280; border:1px solid #d1d5db; border-radius:8px; cursor:pointer; font-size:13px; }

    /* ── SEARCH WITH AUTOCOMPLETE ── */
    .search-wrap { position:relative; flex:1; min-width:220px; }
    .search-wrap input {
      width:100%; padding:11px 40px 11px 14px; border:2px solid #ddd;
      border-radius:10px; font-size:14px; outline:none; transition:border-color 0.2s;
    }
    .search-wrap input:focus { border-color:#4f46e5; }
    .search-clear {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; font-size:16px; color:#aaa; cursor:pointer;
      display:none;
    }
    /* Dropdown suggestions */
    .suggest-box {
      position:absolute; top:calc(100% + 4px); left:0; right:0;
      background:#fff; border:1px solid #e5e7eb; border-radius:10px;
      box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:50;
      max-height:240px; overflow-y:auto; display:none;
    }
    .suggest-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; cursor:pointer; transition:background 0.1s;
      border-bottom:1px solid #f3f4f6;
    }
    .suggest-item:last-child { border-bottom:none; }
    .suggest-item:hover { background:#f5f3ff; }
    .suggest-avatar {
      width:32px; height:32px; border-radius:50%; background:#eef2ff;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:bold; color:#4f46e5; flex-shrink:0;
    }
    .suggest-name  { font-size:14px; font-weight:bold; color:#111; }
    .suggest-meta  { font-size:11px; color:#9ca3af; margin-top:1px; }
    .suggest-highlight { color:#4f46e5; }
    .no-results { padding:16px; text-align:center; color:#9ca3af; font-size:13px; }

    .search-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
    .filter-btn { padding:8px 14px; border:1px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; font-size:12px; font-weight:bold; color:#6b7280; }
    .filter-btn.active { background:#eef2ff; border-color:#4f46e5; color:#4f46e5; }

    /* MODAL */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
    .modal { background:#fff; border-radius:12px; padding:28px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
    .modal h2 { font-size:17px; margin-bottom:20px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-group { display:flex; flex-direction:column; gap:5px; }
    .form-group label { font-size:12px; font-weight:bold; color:#6b7280; text-transform:uppercase; }
    .form-group input, .form-group select { padding:9px 12px; border:1px solid #ddd; border-radius:7px; font-size:13px; outline:none; }
    .form-group input:focus, .form-group select:focus { border-color:#4f46e5; }
    .modal-actions { display:flex; gap:10px; margin-top:16px; }

    /* TOAST */
    #toast { position:fixed; bottom:20px; right:20px; padding:12px 20px; border-radius:9px; font-size:13px; font-weight:bold; z-index:200; display:none; }
    .toast-ok  { background:#ecfdf5; border:1px solid #6ee7b7; color:#065f46; }
    .toast-err { background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; }

    /* FEEDBACK */
    .fb-item { display:flex; gap:12px; align-items:flex-start; padding:12px; background:#f9fafb; border-radius:8px; margin-bottom:10px; }
    .fb-num  { width:26px; height:26px; background:#eef2ff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold; color:#4f46e5; flex-shrink:0; }

    /* PROGRESS */
    .prog-wrap { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:6px; }
    .prog-bar  { height:100%; border-radius:4px; transition:width 0.5s; }
    .empty { text-align:center; padding:40px; color:#9ca3af; font-size:14px; }

    @media (max-width:600px) {
      .form-grid { grid-template-columns:1fr; }
      .content { padding:14px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div style="font-size:36px;margin-bottom:10px">🏫</div>
    <h1>School Portal</h1>
    <p>Student Management System</p>
    <div class="tab-row">

<!-- APP -->
<div id="appScreen">

  <div class="nav-tabs" id="navTabs"></div>

<div id="toast"></div>

    {adm:"100103",name:"Parth Teotia",   sex:"MALE",  cls:10,sec:"B",phone:"9758461384", email:"Parth_teotia_1234@gmail.com", stream:"SCIENCE",  marks:480},
    {adm:"100104",name:"Mahi Ruhela",    sex:"FEMALE",cls:12,sec:"B",phone:"8467915384", email:"Ruhela123Mahi@gmail.com",     stream:"COMMERCE", marks:500},
    {adm:"100105",name:"Ginni Chaudhary",sex:"FEMALE",cls:11,sec:"A",phone:"9745612856", email:"Ginni_4839@gmail.com",        stream:"SCIENCE",  marks:520},

var STORAGE_KEY = "school_system_db";

function loadStorage() {
  var data = localStorage.getItem(STORAGE_KEY);
  if (!data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  return JSON.parse(data);
}

function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    students: students,
    teachers: teachers,
    feedback: feedback
  }));
}

var db = loadStorage();
var students = db.students || [];
var teachers = db.teachers || [];
var feedback = db.feedback || [];

var ADMIN_PASS="Schoolsystem", currentRole="admin", currentPage="dashboard";
var streamFilter="ALL", editingStudent=null, editingTeacher=null;
var currentSearch="";

// ── LOGIN ─────────────────────────────────────────────────────────
function selectRole(r){
  currentRole=r;
  document.getElementById("tabAdmin").className="tab"+(r==="admin"?" active":"");
  document.getElementById("tabUser").className ="tab"+(r==="user"?" active":"");
  document.getElementById("passField").style.display=r==="admin"?"block":"none";
  document.getElementById("userNote").style.display =r==="user"?"block":"none";
  document.getElementById("loginErr").textContent="";
}
function doLogin(){
  if(currentRole==="admin"&&document.getElementById("passInput").value!==ADMIN_PASS){
    document.getElementById("loginErr").textContent="Incorrect password."; return;
  }
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appScreen").style.display="block";
  document.getElementById("roleTag").textContent=currentRole==="admin"?"ADMIN":"USER";
  buildNav(); showPage(currentRole==="admin"?"dashboard":"students");
}
function goHome(){
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("appScreen").style.display="none";
  document.getElementById("passInput").value="";
  document.getElementById("loginErr").textContent="";
}

// ── NAV ───────────────────────────────────────────────────────────
var adminPages=["dashboard","students","teachers","marks","feedback"];
var userPages =["students","marks"];
var pageIcons ={dashboard:"📊",students:"🎓",teachers:"👨‍🏫",marks:"📈",feedback:"💬"};
var pageLabels={dashboard:"Dashboard",students:"Students",teachers:"Teachers",marks:"Marks",feedback:"Feedback"};

function buildNav(){
  var pages=currentRole==="admin"?adminPages:userPages;
  document.getElementById("navTabs").innerHTML=pages.map(function(p){
    return '<div class="nav-tab" id="tab-'+p+'" onclick="showPage(\''+p+'\')">'+pageIcons[p]+' '+pageLabels[p]+'</div>';
  }).join("");
}
function showPage(page){
  currentPage=page; currentSearch=""; streamFilter="ALL";
  (currentRole==="admin"?adminPages:userPages).forEach(function(p){
    var el=document.getElementById("tab-"+p);
    if(el) el.className="nav-tab"+(p===page?" active":"");
  });
  if(page==="dashboard") renderDashboard();
  else if(page==="students") renderStudents();
  else if(page==="teachers") renderTeachers();
  else if(page==="marks") renderMarks();
  else if(page==="feedback") renderFeedback();
}

// ── HELPERS ───────────────────────────────────────────────────────
function grade(m){ return m>=540?"A+":m>=480?"A":m>=400?"B":m>=300?"C":"D"; }
function badge(text,cls){ return '<span class="badge '+cls+'">'+text+'</span>'; }
function streamBadge(s){ return badge(s,"b-"+s.toLowerCase()); }
function sexBadge(s){ return badge(s,"b-"+s.toLowerCase()); }
function toast(msg,ok){
  var el=document.getElementById("toast");
  el.textContent=(ok?"✓ ":"✗ ")+msg;
  el.className=ok?"toast-ok":"toast-err";
  el.style.display="block";

}
function val(id){ var el=document.getElementById(id); return el?el.value:""; }
function closeModal(){ var m=document.getElementById("modalOverlay"); if(m)m.remove(); }

// ── AUTOCOMPLETE SEARCH WIDGET ────────────────────────────────────
function buildSearchBox(containerId, placeholder, dataSource, onSelect, onChange) {
  var box = document.getElementById(containerId);
  if (!box) return;

  box.innerHTML =
    '<div class="search-wrap">'+
      '<input type="text" id="smartSearch" placeholder="'+placeholder+'" autocomplete="off" oninput="handleSearchInput()" onfocus="handleSearchInput()" onblur="hideSuggest()" />'+
      '<button class="search-clear" id="searchClearBtn" onclick="clearSearch()">✕</button>'+
      '<div class="suggest-box" id="suggestBox"></div>'+
    '</div>';

  window._searchDataSource = dataSource;
  window._searchOnSelect   = onSelect;
  window._searchOnChange   = onChange;
}

window.handleSearchInput = function() {
  var input = document.getElementById("smartSearch");
  var q = input ? input.value.trim() : "";
  currentSearch = q;

  var clearBtn = document.getElementById("searchClearBtn");
  if (clearBtn) clearBtn.style.display = q ? "block" : "none";

  var src = window._searchDataSource || [];
  var matches = q.length === 0 ? src : src.filter(function(s){
    return s.name.toLowerCase().includes(q.toLowerCase()) || s.adm.includes(q);
  });

  var box = document.getElementById("suggestBox");
  if (!box) return;

  if (matches.length === 0) {
    box.innerHTML = '<div class="no-results">😕 No student found</div>';
    box.style.display = "block";
  } else {
    box.innerHTML = matches.slice(0,8).map(function(s){
      var highlighted = s.name;
      if (q) {
        var idx = s.name.toLowerCase().indexOf(q.toLowerCase());
        if (idx >= 0) {
          highlighted =
            s.name.slice(0,idx) +
            '<span class="suggest-highlight">'+s.name.slice(idx,idx+q.length)+'</span>' +
            s.name.slice(idx+q.length);
        }
      }
      var initials = s.name.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();
      return '<div class="suggest-item" onmousedown="selectSuggest(\''+s.adm+'\')">'+
        '<div class="suggest-avatar">'+initials+'</div>'+
        '<div>'+
          '<div class="suggest-name">'+highlighted+'</div>'+
          '<div class="suggest-meta">Adm: '+s.adm+' &middot; Class '+s.cls+s.sec+' &middot; '+s.stream+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
    box.style.display = "block";
  }

  if (window._searchOnChange) window._searchOnChange(q);
};

window.selectSuggest = function(adm) {
  var s = (window._searchDataSource||[]).find(function(x){return x.adm===adm;});
  if (!s) return;
  var input = document.getElementById("smartSearch");
  if (input) input.value = s.name;
  currentSearch = s.name;
  var clearBtn = document.getElementById("searchClearBtn");
  if (clearBtn) clearBtn.style.display = "block";
  hideSuggest();
  if (window._searchOnChange) window._searchOnChange(s.name);
  if (window._searchOnSelect) window._searchOnSelect(s);
};

window.hideSuggest = function() {
  setTimeout(function(){
    var box = document.getElementById("suggestBox");
    if (box) box.style.display = "none";
  }, 150);
};

window.clearSearch = function() {
  var input = document.getElementById("smartSearch");
  if (input) { input.value=""; input.focus(); }
  currentSearch = "";
  var clearBtn = document.getElementById("searchClearBtn");
  if (clearBtn) clearBtn.style.display = "none";
  hideSuggest();
  if (window._searchOnChange) window._searchOnChange("");
};

// ── DASHBOARD ─────────────────────────────────────────────────────
function renderDashboard(){
  var avg=students.length?Math.round(students.reduce(function(a,s){return a+s.marks;},0)/students.length):0;
  var topper=students.slice().sort(function(a,b){return b.marks-a.marks;})[0];
  var sc=0,co=0,ar=0;
  students.forEach(function(s){if(s.stream==="SCIENCE")sc++;else if(s.stream==="COMMERCE")co++;else ar++;});
  document.getElementById("pageContent").innerHTML=
    '<div class="stats">'+
      statCard("🎓",students.length,"Total Students")+
      statCard("👨‍🏫",teachers.length,"Teachers")+
      statCard("📊",avg,"Average Marks")+
      statCard("💬",feedback.length,"Feedbacks")+
    '</div>'+
    '<div class="card"><h2>📊 Stream Distribution</h2>'+
      progRow("SCIENCE",sc,students.length,"#4f46e5")+
      progRow("COMMERCE",co,students.length,"#059669")+
      progRow("ARTS",ar,students.length,"#d97706")+
    '</div>'+
    (topper?
    '<div class="card" style="background:#f5f3ff;border:1px solid #c7d2fe">'+
      '<h2>🥇 Class Topper</h2>'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div>'+
          '<div style="font-size:19px;font-weight:bold">'+topper.name+'</div>'+
          '<div style="font-size:12px;color:#6b7280;margin-top:4px">Adm: '+topper.adm+' · Class '+topper.cls+topper.sec+' · '+topper.stream+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:34px;font-weight:bold;color:#4f46e5">'+topper.marks+'</div>'+
          '<div style="font-size:11px;color:#6b7280">MARKS</div>'+
        '</div>'+
      '</div>'+
    '</div>':"");
}
function statCard(icon,val,lbl){ return '<div class="stat-card"><div style="font-size:26px">'+icon+'</div><div class="num">'+val+'</div><div class="lbl">'+lbl+'</div></div>'; }
function progRow(label,count,total,color){
  var pct=total?Math.round(count/total*100):0;
  return '<div style="margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>'+label+'</span><span>'+count+' students</span></div>'+
    '<div class="prog-wrap"><div class="prog-bar" style="width:'+pct+'%;background:'+color+'"></div></div>'+
  '</div>';
}

// ── STUDENTS ──────────────────────────────────────────────────────
function renderStudents(){
  var isAdmin=currentRole==="admin";
  var filterBtns=["ALL","SCIENCE","COMMERCE","ARTS"].map(function(f){
    return '<button class="filter-btn'+(streamFilter===f?" active":"")+'" onclick="setFilter(\''+f+'\')">'+f+'</button>';
  }).join("");

  document.getElementById("pageContent").innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<div><h2 style="font-size:20px">Students</h2><p style="font-size:13px;color:#6b7280">'+students.length+' total records</p></div>'+
      (isAdmin?'<button class="btn-add" onclick="openAddStudent()">+ Add Student</button>':'')+
    '</div>'+
    '<div class="search-row">'+
      '<div id="searchContainer"></div>'+
      filterBtns+
    '</div>'+
    '<div id="studentTable"></div>';

  buildSearchBox("searchContainer", "🔍  Type a name or admission no...", students,
    null,
    function(q){ refreshStudentTable(q); }
  );

  refreshStudentTable("");
}

function refreshStudentTable(search){
  var isAdmin=currentRole==="admin";
  var list=students.filter(function(s){
    var ms=!search || s.name.toLowerCase().includes(search.toLowerCase()) || s.adm.includes(search);
    var mf=streamFilter==="ALL"||s.stream===streamFilter;
    return ms&&mf;
  });
  var rows=list.length===0
    ?'<tr><td colspan="'+(isAdmin?8:7)+'" class="empty">No students found</td></tr>'
    :list.map(function(s){
      return '<tr>'+
        '<td><b style="color:#4f46e5">'+s.adm+'</b></td>'+
        '<td><b>'+s.name+'</b></td>'+
        '<td>'+sexBadge(s.sex)+'</td>'+
        '<td>'+s.cls+s.sec+'</td>'+
        '<td>'+streamBadge(s.stream)+'</td>'+
        '<td>'+s.marks+' <span class="badge b-grade">('+grade(s.marks)+')</span></td>'+
        '<td style="font-size:12px;color:#6b7280">'+s.email+'</td>'+
        (isAdmin?'<td><button class="btn-edit" onclick="openEditStudent(\''+s.adm+'\')">Edit</button> <button class="btn-del" onclick="deleteStudent(\''+s.adm+'\')">Del</button></td>':'')+
      '</tr>';
    }).join("");

  var tbl=document.getElementById("studentTable");
  if(tbl) tbl.innerHTML=
    '<div class="card" style="padding:0;overflow:hidden">'+
      '<div class="table-wrap"><table>'+
        '<thead><tr><th>Adm No.</th><th>Name</th><th>Gender</th><th>Class</th><th>Stream</th><th>Marks</th><th>Email</th>'+(isAdmin?'<th>Actions</th>':'')+
        '</tr></thead><tbody>'+rows+'</tbody>'+
      '</table></div>'+
    '</div>';
}

function setFilter(f){ streamFilter=f; renderStudents(); }

// Student CRUD
function openAddStudent(){ editingStudent=null; document.getElementById("pageContent").innerHTML+=studentModal(null); }
function openEditStudent(adm){ editingStudent=students.find(function(s){return s.adm===adm;}); document.getElementById("pageContent").innerHTML+=studentModal(editingStudent); }
function studentModal(s){
  var isEdit=!!s; s=s||{};
  return '<div class="overlay" id="modalOverlay">'+
    '<div class="modal"><h2>'+(isEdit?"✏️ Edit":"➕ Add")+' Student</h2>'+
    '<div class="form-grid">'+
      (!isEdit?fld("Admission No.","adm","text","")+fld("Full Name","name","text",""):fld("Full Name","name","text",s.name||""))+
      fselect("Gender","sex",["MALE","FEMALE"],s.sex||"MALE")+
      fld("Class","cls","number",s.cls||"")+
      fld("Section","sec","text",s.sec||"")+
      fld("Phone","phone","text",s.phone||"")+
      fld("Email","email","text",s.email||"")+
      fselect("Stream","stream",["SCIENCE","COMMERCE","ARTS"],s.stream||"SCIENCE")+
      fld("Marks","marks","number",s.marks||"")+
    '</div>'+
    '<div class="modal-actions">'+
      '<button class="btn-add" onclick="saveStudent()">'+(isEdit?"Save Changes":"Add Student")+'</button>'+
      '<button class="btn-cancel" onclick="closeModal()">Cancel</button>'+
    '</div></div></div>';
}
function saveStudent(){
  var name=val("name"),sex=val("sex"),cls=parseInt(val("cls")),sec=val("sec").toUpperCase(),
      phone=val("phone"),email=val("email"),stream=val("stream"),marks=parseInt(val("marks"));
  if(editingStudent){
    var idx=students.findIndex(function(s){return s.adm===editingStudent.adm;});
    students[idx]={adm:editingStudent.adm,name,sex,cls,sec,phone,email,stream,marks};
    saveStorage();
    toast("Student updated",true);
  } else {
    var adm=val("adm");
    if(!adm){alert("Enter Admission No.");return;}
    if(students.find(function(s){return s.adm===adm;})){toast("Admission No. already exists",false);return;}
    students.push({adm,name,sex,cls,sec,phone,email,stream,marks});
    saveStorage();
    toast("Student added",true);
  }
  closeModal(); renderStudents();
}
function deleteStudent(adm){
  if(!confirm("Delete this student?"))return;
  students=students.filter(function(s){return s.adm!==adm;});
  saveStorage();
  toast("Student deleted",true); renderStudents();
}

// ── TEACHERS ──────────────────────────────────────────────────────
function renderTeachers(){
  var isAdmin=currentRole==="admin";
  var rows=teachers.map(function(t){
    return '<tr>'+
      '<td><b style="color:#059669">'+t.id+'</b></td>'+
      '<td><b>'+t.name+'</b></td>'+
      '<td>'+badge(t.subject,"b-commerce")+'</td>'+
      '<td style="font-size:12px;color:#6b7280">'+t.phone+'</td>'+
      '<td style="font-size:12px;color:#6b7280">'+t.email+'</td>'+
      (isAdmin?'<td><button class="btn-edit" onclick="openEditTeacher('+t.id+')">Edit</button> <button class="btn-del" onclick="deleteTeacher('+t.id+')">Del</button></td>':'')+
    '</tr>';
  }).join("");
  document.getElementById("pageContent").innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<div><h2 style="font-size:20px">Teachers</h2><p style="font-size:13px;color:#6b7280">'+teachers.length+' staff members</p></div>'+
      (isAdmin?'<button class="btn-add" onclick="openAddTeacher()">+ Add Teacher</button>':'')+
    '</div>'+
    '<div class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table>'+
      '<thead><tr><th>ID</th><th>Name</th><th>Subject</th><th>Phone</th><th>Email</th>'+(isAdmin?'<th>Actions</th>':'')+
      '</tr></thead><tbody>'+rows+'</tbody>'+
    '</table></div></div>';
}
function openAddTeacher(){ editingTeacher=null; document.getElementById("pageContent").innerHTML+=teacherModal(null); }
function openEditTeacher(id){ editingTeacher=teachers.find(function(t){return t.id===id;}); document.getElementById("pageContent").innerHTML+=teacherModal(editingTeacher); }
function teacherModal(t){
  var isEdit=!!t; t=t||{};
  return '<div class="overlay" id="modalOverlay"><div class="modal"><h2>'+(isEdit?"✏️ Edit":"➕ Add")+' Teacher</h2>'+
    '<div class="form-grid">'+
      (!isEdit?fld("Teacher ID","tid","number",""):"")+
      fld("Full Name","tname","text",t.name||"")+
      fld("Subject","tsubject","text",t.subject||"")+
      fld("Phone","tphone","text",t.phone||"")+
      fld("Email","temail","text",t.email||"")+
    '</div>'+
    '<div class="modal-actions">'+
      '<button class="btn-add" onclick="saveTeacher()">'+(isEdit?"Save Changes":"Add Teacher")+'</button>'+
      '<button class="btn-cancel" onclick="closeModal()">Cancel</button>'+
    '</div></div></div>';
}
function saveTeacher(){
  var name=val("tname"),subject=val("tsubject"),phone=val("tphone"),email=val("temail");
  if(editingTeacher){
    var idx=teachers.findIndex(function(t){return t.id===editingTeacher.id;});
    teachers[idx]={id:editingTeacher.id,name,subject,phone,email};
    saveStorage();
    toast("Teacher updated",true);
  } else {
    var id=parseInt(val("tid"));
    if(!id){alert("Enter Teacher ID");return;}
    if(teachers.find(function(t){return t.id===id;})){toast("Teacher ID exists",false);return;}
    teachers.push({id,name,subject,phone,email});
    saveStorage();
    toast("Teacher added",true);
  }
  closeModal(); renderTeachers();
}
function deleteTeacher(id){
  if(!confirm("Delete this teacher?"))return;
  teachers=teachers.filter(function(t){return t.id!==id;});
  saveStorage();
  toast("Teacher deleted",true); renderTeachers();
}

// ── MARKS ─────────────────────────────────────────────────────────
function renderMarks(){
  document.getElementById("pageContent").innerHTML=
    '<h2 style="font-size:20px;margin-bottom:16px">📈 View Marks</h2>'+
    '<div class="search-row"><div id="marksSearchContainer"></div></div>'+
    '<div id="marksTable"></div>';

  buildSearchBox("marksSearchContainer","🔍  Search student name...",students,
    null,
    function(q){ refreshMarksTable(q); }
  );
  refreshMarksTable("");
}
function refreshMarksTable(search){
  var list=students.slice().sort(function(a,b){return b.marks-a.marks;});
  if(search) list=list.filter(function(s){return s.name.toLowerCase().includes(search.toLowerCase());});
  var rows=list.map(function(s,i){
    return '<tr>'+
      '<td style="color:'+(i===0?"#d97706":"#6b7280")+';font-weight:bold">#'+(i+1)+'</td>'+
      '<td><b>'+s.name+'</b></td>'+
      '<td style="color:#4f46e5">'+s.adm+'</td>'+
      '<td>'+streamBadge(s.stream)+'</td>'+
      '<td>'+s.cls+s.sec+'</td>'+
      '<td><b>'+s.marks+'</b></td>'+
      '<td>'+badge(grade(s.marks),"b-grade")+'</td>'+
    '</tr>';
  }).join("");
  var tbl=document.getElementById("marksTable");
  if(tbl) tbl.innerHTML=
    '<div class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table>'+
      '<thead><tr><th>Rank</th><th>Name</th><th>Adm</th><th>Stream</th><th>Class</th><th>Marks</th><th>Grade</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
}

// ── FEEDBACK ──────────────────────────────────────────────────────
function renderFeedback(){
  var isAdmin=currentRole==="admin";
  var items=feedback.map(function(f,i){
    return '<div class="fb-item">'+
      '<div class="fb-num">'+(i+1)+'</div>'+
      '<div style="flex:1">'+f.text+'</div>'+
      (isAdmin?'<button class="btn-del" onclick="deleteFeedback('+f.id+')">✕</button>':'')+
    '</div>';
  }).join("");
  document.getElementById("pageContent").innerHTML=
    '<h2 style="font-size:20px;margin-bottom:16px">💬 Feedback</h2>'+
    (isAdmin?'<div class="card"><h2>Add Feedback</h2>'+
      '<textarea id="fbText" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;min-height:80px;resize:vertical" placeholder="Enter feedback about a student..."></textarea>'+
      '<br><br><button class="btn-add" onclick="addFeedback()">Submit Feedback</button></div>':"")+
    '<div class="card"><h2>All Feedback ('+feedback.length+')</h2>'+items+'</div>';
}
function addFeedback(){
  var t=document.getElementById("fbText").value.trim();
  if(!t)return;
  feedback.push({id:Date.now(),text:t});
  saveStorage();
  toast("Feedback submitted",true); renderFeedback();
}
function deleteFeedback(id){
  feedback=feedback.filter(function(f){return f.id!==id;});
  saveStorage();
  toast("Feedback deleted",true); renderFeedback();
}

// ── FORM HELPERS ──────────────────────────────────────────────────
function fld(label,id,type,value,placeholder){
  return '<div class="form-group"><label>'+label+'</label>'+
    '<input type="'+type+'" id="'+id+'" value="'+(value||'')+'" placeholder="'+(placeholder||'')+'"/></div>';
}
function fselect(label,id,options,selected){
  var opts=options.map(function(o){return '<option'+(o===selected?' selected':'')+'>'+o+'</option>';}).join("");
  return '<div class="form-group"><label>'+label+'</label><select id="'+id+'">'+opts+'</select></div>';
}
</script>
